name: ML 30% Target Backtest

on:
  workflow_dispatch:
  schedule:
    - cron: '30 16 * * 0'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run walk-forward research
        run: python src/backtest_30pct.py --period 5y --output docs/backtest_30pct.json

      - name: Publish result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/backtest_30pct.json
          git diff --cached --quiet || (git commit -m 'Auto: update ML 30% target backtest' && git push)
