name: Research Phase 04 - Robustness
on:
  workflow_dispatch:
    inputs:
      research_branch:
        required: true
        default: research/phase-04-robustness
        type: string
permissions:
  contents: write
jobs:
  robustness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.research_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          pip install -r requirements.txt
          pip install -r requirements-research.txt
      - run: python scripts/research/preflight.py --phase phase-04-robustness --branch "${{ inputs.research_branch }}"
      - name: Fail closed until primary backtest exists
        run: |
          test -f research/results/primary_performance.json || { echo "Primary backtest output missing; robustness phase cannot proceed."; exit 1; }
      - name: Record status
        if: always()
        run: |
          python scripts/research/record_step.py --phase phase-04-robustness --step robustness_gate --status BLOCKED --summary "Robustness awaits verified Phase 03 outputs."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/STATUS.json research/RUN_LOG.jsonl research/ERROR_LOG.md
          git diff --cached --quiet || (git commit -m "Research: phase 04 gate status" && git push origin "${{ inputs.research_branch }}")
