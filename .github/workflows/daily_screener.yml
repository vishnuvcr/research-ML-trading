name: Daily Stock Surge ML Screener

on:
  schedule:
    # 10:30 UTC = 16:00 IST (Mon-Fri)
    - cron: '30 10 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write
  actions: read

concurrency:
  group: 'daily-screener'
  cancel-in-progress: true

jobs:
  build-and-screen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Machine Learning Screening Pipeline
        run: |
          python src/pipeline.py

      - name: Commit and Push Logs & Artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/history.json strategy_v6.pine
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Update daily forecast and history [$(date -u '+%Y-%m-%d %H:%M') UTC]" && git push)

      - name: Upload Screener Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-screener-${{ github.run_number }}
          path: |
            docs/data.json
            docs/history.json
            strategy_v6.pine
          if-no-files-found: warn
          retention-days: 14
