name: Daily Stock Surge ML Screener

on:
  schedule:
    # 10:30 UTC = 16:00 IST (Mon-Fri)
    - cron: '30 10 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-screen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Machine Learning Screening Pipeline
        run: |
          python src/pipeline.py

      - name: Commit and Push Logs & Artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/history.json strategy_v6.pine
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Update daily forecast and history [$(date -u '+%Y-%m-%d %H:%M') UTC]" && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
