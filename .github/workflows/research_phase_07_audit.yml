name: Research Phase 07 - Final Audit
on:
  workflow_dispatch:
    inputs:
      research_branch:
        required: true
        default: research/phase-07-audit
        type: string
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.research_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          pip install -r requirements.txt
          pip install -r requirements-research.txt
      - run: python scripts/research/preflight.py --phase phase-07-audit --branch "${{ inputs.research_branch }}"
      - name: Fail closed until manuscript exists
        run: |
          test -f research/manuscript/final_manuscript.md || { echo "Final manuscript missing; audit cannot pass."; exit 1; }
      - name: Record gate
        if: always()
        run: |
          python scripts/research/record_step.py --phase phase-07-audit --step final_audit_gate --status BLOCKED --summary "Final audit awaits verified manuscript and all upstream phase outputs."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/STATUS.json research/RUN_LOG.jsonl
          git diff --cached --quiet || (git commit -m "Research: phase 07 audit gate status" && git push origin "${{ inputs.research_branch }}")
