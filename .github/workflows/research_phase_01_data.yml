name: Research Phase 01 - Data
on:
  workflow_dispatch:
    inputs:
      research_branch:
        description: Phase branch
        required: true
        default: research/phase-01-data
        type: string
permissions:
  contents: write
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.research_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -r requirements-research.txt
      - name: Preflight
        run: python scripts/research/preflight.py --phase phase-01-data --branch "${{ inputs.research_branch }}"
      - name: Execute phase
        run: python scripts/research/phase_runner.py --phase phase-01-data
      - name: Record and push
        run: |
          python scripts/research/record_step.py --phase phase-01-data --step data_phase --status READY --summary "Data phase scaffold executed; source/cache adapter must produce validated datasets before Phase 02."
          python scripts/research/build_pages.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/STATUS.json research/RUN_LOG.jsonl docs/ data/
          git diff --cached --quiet || (git commit -m "Research: phase 01 data status" && git push origin "${{ inputs.research_branch }}")
