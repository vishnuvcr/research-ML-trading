name: Research Phase 06 - Manuscript
on:
  workflow_dispatch:
    inputs:
      research_branch:
        required: true
        default: research/phase-06-manuscript
        type: string
permissions:
  contents: write
jobs:
  manuscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.research_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          pip install -r requirements.txt
          pip install -r requirements-research.txt
      - run: python scripts/research/preflight.py --phase phase-06-manuscript --branch "${{ inputs.research_branch }}"
      - name: Fail closed until statistical outputs exist
        run: |
          test -f research/results/statistical_inference.json || { echo "Statistical inference output missing; manuscript phase cannot proceed."; exit 1; }
      - name: Record gate
        if: always()
        run: |
          python scripts/research/record_step.py --phase phase-06-manuscript --step manuscript_gate --status BLOCKED --summary "Manuscript generation awaits verified statistical outputs."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/STATUS.json research/RUN_LOG.jsonl
          git diff --cached --quiet || (git commit -m "Research: phase 06 gate status" && git push origin "${{ inputs.research_branch }}")
