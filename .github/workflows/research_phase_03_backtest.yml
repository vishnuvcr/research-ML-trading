name: Research Phase 03 - Backtest
on:
  workflow_dispatch:
    inputs:
      research_branch:
        description: Phase branch
        required: true
        default: research/phase-03-backtest
        type: string
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.research_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -r requirements-research.txt
      - name: Preflight
        run: python scripts/research/preflight.py --phase phase-03-backtest --branch "${{ inputs.research_branch }}"
      - name: Execute phase
        run: python scripts/research/phase_runner.py --phase phase-03-backtest
      - name: Record and push
        if: always()
        run: |
          python scripts/research/record_step.py --phase phase-03-backtest --step backtest_phase --status FAILED --summary "Backtest cannot proceed until the validated Paytm Money cost profile and full data/feature implementation exist." --error "Cost-sensitive backtest is fail-closed by protocol."
          python scripts/research/build_pages.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/STATUS.json research/RUN_LOG.jsonl research/ERROR_LOG.md docs/
          git diff --cached --quiet || (git commit -m "Research: phase 03 blocked status" && git push origin "${{ inputs.research_branch }}")
          exit 1
