name: ML Intraday + BTST Engine

on:
  workflow_dispatch:
  schedule:
    # Approx. 09:30-15:30 IST, every 15 minutes, Mon-Fri
    - cron: '*/15 4-10 * * 1-5'
    # Approx. 15:45 IST BTST snapshot
    - cron: '15 10 * * 1-5'

permissions:
  contents: write

concurrency:
  group: ml-intraday-btst
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run ML engine
        env:
          TZ: Asia/Kolkata
        run: python src/ml_intraday_btst.py --config config/trading.yaml
      - name: Commit signals and backtest artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/data.json docs/history.json docs/backtest.json docs/signals.csv
          git diff --cached --quiet || git commit -m 'Auto: update ML intraday/BTST signals'
          git push
